[file paths] # The client will create these files if not present at the location
camera_config = ~/.config/pick-and-place-ur3/camera.ini
database = ~/.local/share/pick-and-place-ur3/database.sqlite

[default camera config] # Default camera configuration when the client is first ran. When you press the "reset to default" option in the camera configuration menu, it will reset to these values.
cam_index = 0
cam_width = 1920
cam_height = 1080
crop_x = 0
crop_y = 0
crop_width = 1920
crop_height = 1080